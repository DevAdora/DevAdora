name: Update README Timestamp

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Update Last Updated timestamp
        run: |
          sed -i "s/Last Updated:.*/Last Updated: $(date -u +"%Y-%m-%d %H:%M UTC")/" README.md

      - name: Configure Git identity
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Commit & Push
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git add README.md
          git diff --cached --quiet && echo "No changes, skipping." && exit 0
          git commit -m "chore: update README timestamp [skip ci]"
          git push https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }} HEAD:${{ github.ref }}
